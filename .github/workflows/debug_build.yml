name: debug-build
on:
  workflow_dispatch:
jobs:
  build-debug:
    runs-on: macos-15 # all options: https://github.com/actions/runner-images/tree/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags + history for `git describe` versioning
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: pod install
      - run: ai/build-debug-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AltTabDebug
          path: |
            AltTabDebug-*.pkg
            AltTabDebug-*.zip
          if-no-files-found: error
